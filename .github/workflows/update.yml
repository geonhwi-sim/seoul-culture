# 매일 새벽 5시(KST) 전시·공연 정보를 새로 수집해 GitHub Pages에 배포
name: update

on:
  schedule:
    - cron: '0 20 * * *'
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - run: npm ci

      - name: 수집
        if: github.event_name != 'push'
        run: npm run fetch
        env:
          SEOUL_API_KEY: ${{ secrets.SEOUL_API_KEY }}
          KOPIS_API_KEY: ${{ secrets.KOPIS_API_KEY }}
          KCISA_API_KEY: ${{ secrets.KCISA_API_KEY }}

      - name: 수집 결과 커밋
        if: github.event_name != 'push'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add public/events.json scripts/cache
          git diff --cached --quiet || git commit -m "data: $(TZ=Asia/Seoul date +%F) 전시·공연 갱신"
          git push

      - run: npm run build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist
      - id: deploy
        uses: actions/deploy-pages@v4
